<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#123D2B">
<title>Cyber Cafe &amp; CSC Service Manager — RIYAJUL DIGITAL SOLUTIONS</title>
<style>
/* ============================================================
   RIYAJUL DIGITAL SOLUTIONS — Design System
   ============================================================ */
:root{
  --green-900:#123D2B; --green-800:#1D5B40; --bg-deep:#0E2119;
  --gold:#D4AF37; --gold-l:#F2D98A;
  --white:#FFFFFF; --off:#F7F8F5; --lgreen:#E8F1EA;
  --text:#25332B; --text2:#778078; --border:#E1E7E1;
  --danger:#C62828; --success:#218653; --warning:#D98C16;
  --surface:#FFFFFF; --surface-2:#F7F8F5; --surface-3:#EEF3EE;
  --shadow:0 2px 10px rgba(18,61,43,.08);
  --shadow-lg:0 10px 30px rgba(18,61,43,.14);
  --radius:14px; --radius-sm:9px;
  --sidebar-w:248px;
}
[data-theme="dark"]{
  --white:#122A1F; --off:#0E2119; --lgreen:#163526;
  --text:#E6EFE8; --text2:#9BAFA2; --border:#1E3A2C;
  --surface:#122A1F; --surface-2:#0E2119; --surface-3:#17372A;
  --shadow:0 2px 12px rgba(0,0,0,.45);
  --shadow-lg:0 12px 34px rgba(0,0,0,.55);
  --green-900:#0B2A1D;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Bengali","Nirmala UI",Roboto,Arial,sans-serif;
  background:var(--surface-2); color:var(--text);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--green-800);text-decoration:none}
[data-theme="dark"] a{color:var(--gold-l)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#b9c7bd;border-radius:9px}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#28473a}

/* ---------- APP SHELL ---------- */
.app{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:linear-gradient(180deg,var(--green-900),var(--bg-deep));
  color:#DCE8E0; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; z-index:60;
  border-right:1px solid rgba(212,175,55,.16);
}
.brand{padding:18px 16px 14px;display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(212,175,55,.16)}
.brand-logo{
  width:42px;height:42px;border-radius:12px;flex:0 0 42px;
  background:linear-gradient(145deg,var(--gold),#a9861f);
  display:grid;place-items:center;color:#123D2B;font-weight:900;font-size:15px;
  box-shadow:0 4px 14px rgba(212,175,55,.35);letter-spacing:-.5px;
}
.brand-name{font-size:12.5px;font-weight:800;color:#fff;letter-spacing:.4px;line-height:1.25}
.brand-sub{font-size:10px;color:var(--gold-l);letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:10px 10px 18px}
.nav-group{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#7fa08f;padding:14px 10px 6px;font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
  color:#CBDCD2;font-size:13px;font-weight:500;margin-bottom:2px;width:100%;text-align:left;
  transition:background .16s,color .16s;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(212,175,55,.24),rgba(212,175,55,.06));color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--gold)}
.nav-item .ico{width:20px;text-align:center;font-size:14px;filter:grayscale(.2)}
.nav-badge{margin-left:auto;background:var(--gold);color:#123D2B;font-size:10px;font-weight:800;padding:1px 6px;border-radius:20px}
.sidebar-foot{padding:12px 14px;border-top:1px solid rgba(212,175,55,.16);font-size:10.5px;color:#7fa08f;line-height:1.6}
.sidebar-foot b{color:var(--gold-l)}

/* Main column */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);
  box-shadow:0 1px 0 rgba(18,61,43,.04);
}
.hamburger{display:none;font-size:19px;padding:6px 8px;border-radius:8px;background:var(--surface-3)}
.topbar-title{font-weight:800;font-size:14.5px;letter-spacing:.2px}
.topbar-title small{display:block;font-weight:500;font-size:11px;color:var(--text2);letter-spacing:.2px}
.topbar-spacer{flex:1}
.searchbox{
  display:flex;align-items:center;gap:7px;background:var(--surface-3);border:1px solid var(--border);
  border-radius:10px;padding:6px 11px;min-width:250px;max-width:380px;flex:1;
}
.searchbox input{border:none;background:none;outline:none;width:100%;font-size:13px}
.searchbox kbd{font-size:10px;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--text2)}
.icon-btn{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:var(--surface-3);border:1px solid var(--border);transition:.15s;position:relative;
}
.icon-btn:hover{background:var(--lgreen);border-color:var(--gold)}
.icon-btn .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:1.5px solid var(--surface)}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;
  background:var(--green-900);color:#fff;font-weight:600;font-size:12.5px;transition:.15s;
  border:1px solid transparent;white-space:nowrap;
}
.btn:hover{background:var(--green-800);transform:translateY(-1px)}
.btn.gold{background:linear-gradient(145deg,var(--gold),#b8952c);color:#123D2B}
.btn.gold:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn.block{width:100%;justify-content:center}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* Content */
.view{padding:20px 22px 60px;max-width:1500px;width:100%;margin:0 auto;flex:1}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.3px;color:var(--text)}
.page-sub{font-size:12.5px;color:var(--text2);margin-top:3px;max-width:720px}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card.pad0{padding:0;overflow:hidden}
.grid{display:grid;gap:14px}
.stat-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 15px;position:relative;overflow:hidden;box-shadow:var(--shadow);
}
.stat::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(180deg,var(--gold),var(--green-800))}
.stat .lbl{font-size:11px;color:var(--text2);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.stat .val{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.stat .sub{font-size:11px;color:var(--text2);margin-top:3px}
.stat.green .val{color:var(--success)}
.stat.red .val{color:var(--danger)}
.stat.gold .val{color:#b8952c}
[data-theme="dark"] .stat.gold .val{color:var(--gold-l)}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:12.8px;min-width:600px}
thead th{
  background:var(--surface-3);text-align:left;padding:10px 12px;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.7px;color:var(--text2);font-weight:800;
  border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-3)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}

/* Badges & chips */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.badge.green{background:rgba(33,134,83,.13);color:var(--success)}
.badge.gold{background:rgba(212,175,55,.18);color:#9a7c1e}
[data-theme="dark"] .badge.gold{color:var(--gold-l)}
.badge.red{background:rgba(198,40,40,.12);color:var(--danger)}
.badge.grey{background:var(--surface-3);color:var(--text2)}
.badge.blue{background:rgba(29,91,64,.12);color:var(--green-800)}
[data-theme="dark"] .badge.blue{color:#7fd1a8}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{
  padding:6px 13px;border-radius:20px;background:var(--surface);border:1px solid var(--border);
  font-size:12px;font-weight:600;color:var(--text2);transition:.15s;
}
.chip:hover{border-color:var(--gold);color:var(--text)}
.chip.active{background:var(--green-900);color:#fff;border-color:var(--green-900)}

/* Service cards */
.svc-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
.svc{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;display:flex;flex-direction:column;gap:9px;transition:.16s;position:relative;overflow:hidden;
}
.svc:hover{border-color:var(--gold);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.svc .no{
  position:absolute;top:10px;right:12px;font-size:10px;font-weight:800;color:var(--text2);
  background:var(--surface-3);padding:1px 7px;border-radius:20px;
}
.svc .en{font-weight:800;font-size:13.5px;line-height:1.35;padding-right:38px}
.svc .bn{font-size:12.5px;color:var(--text2);line-height:1.4}
.svc .cat{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#9a7c1e}
[data-theme="dark"] .svc .cat{color:var(--gold-l)}
.svc .prices{display:flex;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--border);padding-top:9px;margin-top:auto}
.svc .pbox{flex:1;min-width:80px}
.svc .pbox .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);font-weight:700}
.svc .pbox .v{font-size:12.5px;font-weight:800;margin-top:1px}
.svc .actions{display:flex;gap:6px;margin-top:4px}
.svc .actions .btn{flex:1;justify-content:center}

/* Forms */
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:5px;letter-spacing:.2px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface);outline:none;transition:.15s;font-size:13px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
.field textarea{resize:vertical;min-height:64px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:11px;color:var(--text2);margin-top:4px;line-height:1.45}

/* Modal */
#modalRoot{position:fixed;inset:0;z-index:200;display:none}
#modalRoot.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(9,24,17,.62);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto}
.modal{
  background:var(--surface);border-radius:16px;width:100%;max-width:560px;margin:auto;
  box-shadow:var(--shadow-lg);border:1px solid var(--border);animation:pop .18s ease;
}
.modal.wide{max-width:900px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;font-weight:800;flex:1}
.modal-body{padding:16px 18px;max-height:66vh;overflow-y:auto}
.modal-foot{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

/* Toast */
#toastRoot{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--green-900);color:#fff;padding:11px 16px;border-radius:10px;font-size:12.5px;
  box-shadow:var(--shadow-lg);border-left:4px solid var(--gold);animation:slide .22s ease;max-width:320px;
}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--success)}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* Empty state */
.empty{text-align:center;padding:44px 18px;color:var(--text2)}
.empty .e-ico{font-size:38px;opacity:.55;margin-bottom:10px}
.empty h4{font-size:15px;color:var(--text);margin-bottom:5px}
.empty p{font-size:12.5px;max-width:420px;margin:0 auto 14px}

/* Chart canvases */
.chart-box{position:relative;height:200px;width:100%}
.chart-box canvas{width:100%;height:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px}
.legend span{display:flex;align-items:center;gap:5px;color:var(--text2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Invoice / print area */
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none !important}
  #printArea{display:block !important;padding:0;background:#fff;color:#000}
  .no-print{display:none !important}
  @page{margin:12mm}
}
.doc{font-family:"Segoe UI",system-ui,sans-serif;color:#1b2b22;background:#fff;max-width:820px;margin:0 auto}
.doc-head{display:flex;justify-content:space-between;gap:18px;border-bottom:3px solid #123D2B;padding-bottom:12px;flex-wrap:wrap}
.doc-brand{font-size:19px;font-weight:900;color:#123D2B;letter-spacing:.3px}
.doc-tag{font-size:10.5px;color:#5c6d63;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
.doc-meta{font-size:11px;color:#4a5a51;text-align:right;line-height:1.65}
.doc h4{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#123D2B;margin:16px 0 7px;border-bottom:1px solid #d8e2da;padding-bottom:4px}
.doc table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:0}
.doc th{background:#eef3ee;padding:7px 8px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#3d5147}
.doc td{padding:7px 8px;border-bottom:1px solid #e6ece7}
.doc .tot-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px}
.doc .tot-row.grand{border-top:2px solid #123D2B;margin-top:6px;padding-top:8px;font-weight:900;font-size:14.5px;color:#123D2B}
.doc-foot{margin-top:18px;border-top:1px dashed #c9d6cd;padding-top:10px;font-size:10px;color:#5c6d63;line-height:1.6}
.doc-note{background:#fbf6e3;border:1px solid #e8dcae;border-radius:7px;padding:8px 10px;font-size:10px;color:#6b5b1d;margin-top:10px;line-height:1.55}

/* Misc */
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:12.5px}
.kv:last-child{border:none}
.kv .k{color:var(--text2)}
.kv .v{font-weight:700;text-align:right}
.section-title{font-size:13px;font-weight:800;letter-spacing:.3px;margin:0 0 10px;display:flex;align-items:center;gap:7px}
.section-title .bar{width:3px;height:14px;border-radius:2px;background:var(--gold)}
.muted{color:var(--text2)}
.tiny{font-size:11px}
.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.divider{height:1px;background:var(--border);margin:14px 0}
.pill-tabs{display:flex;gap:4px;background:var(--surface-3);padding:4px;border-radius:10px;flex-wrap:wrap}
.pill-tabs button{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:700;color:var(--text2)}
.pill-tabs button.active{background:var(--surface);color:var(--green-900);box-shadow:var(--shadow)}
[data-theme="dark"] .pill-tabs button.active{color:var(--gold-l)}
.alert{background:rgba(217,140,22,.1);border:1px solid rgba(217,140,22,.4);border-radius:10px;padding:11px 13px;font-size:12px;line-height:1.6}
.alert.info{background:rgba(29,91,64,.07);border-color:rgba(29,91,64,.28)}
.alert.danger{background:rgba(198,40,40,.07);border-color:rgba(198,40,40,.3)}
.footer{margin-top:30px;padding:18px 22px;border-top:1px solid var(--border);text-align:center;font-size:11.5px;color:var(--text2);line-height:1.7}
.footer b{color:var(--text)}

/* Mobile bottom nav */
.bottomnav{display:none}

/* Search overlay */
.search-overlay{position:fixed;inset:0;z-index:250;background:rgba(9,24,17,.6);backdrop-filter:blur(3px);display:none;padding:60px 14px 14px}
.search-overlay.open{display:block}
.search-panel{max-width:640px;margin:0 auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;border:1px solid var(--border)}
.search-panel input{width:100%;padding:15px 18px;border:none;outline:none;background:transparent;font-size:15px;border-bottom:1px solid var(--border)}
.search-results{max-height:60vh;overflow-y:auto}
.sr-item{display:flex;gap:11px;padding:11px 18px;border-bottom:1px solid var(--border);cursor:pointer;align-items:center}
.sr-item:hover{background:var(--surface-3)}
.sr-item .t{font-weight:700;font-size:13px}
.sr-item .s{font-size:11.5px;color:var(--text2)}
.sr-item .badge{margin-left:auto}

/* Responsive */
@media(max-width:1080px){
  .searchbox{min-width:0;max-width:220px}
}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .24s ease;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .hamburger{display:grid;place-items:center}
  .view{padding:14px 13px 90px}
  .bottomnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:55;background:var(--surface);
    border-top:1px solid var(--border);padding:5px 4px;justify-content:space-around;box-shadow:0 -3px 14px rgba(18,61,43,.09);
  }
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:9.5px;font-weight:700;color:var(--text2);border-radius:9px}
  .bottomnav button .ico{font-size:17px}
  .bottomnav button.active{color:var(--green-800);background:var(--lgreen)}
  [data-theme="dark"] .bottomnav button.active{color:var(--gold-l)}
  .page-title{font-size:18px}
  .stat .val{font-size:19px}
  .row2,.row3{grid-template-columns:1fr}
  .topbar{padding:8px 12px}
  .topbar-title small{display:none}
  .searchbox{display:none}
  .topbar .hide-sm{display:none}
}
@media(max-width:560px){
  .svc-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .modal-body{max-height:72vh}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">RDS</div>
      <div>
        <div class="brand-name">RIYAJUL DIGITAL<br>SOLUTIONS</div>
        <div class="brand-sub">Cyber • CSC • Printing</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <b>Made with ❤️ by Aliriyaj007</b><br>
      <a href="https://github.com/Aliriyaj007" target="_blank" rel="noopener" style="color:#9fc0ad">github.com/Aliriyaj007</a>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" data-act="toggleSidebar" aria-label="Menu">☰</button>
      <div class="topbar-title">
        <span id="tbTitle">Dashboard</span>
        <small id="tbSub">Cyber Cafe &amp; CSC Service Manager</small>

function catOf(num){
  if(num<=15) return 'identity';
  if(num<=25) return 'ration';
  if(num<=38) return 'wb';
  if(num<=52) return 'health';
  if(num<=62) return 'banking';
  if(num<=74) return 'edu';
  if(num<=86) return 'transport';
  if(num<=94) return 'business';
  if(num<=99) return 'travel';
  if(num<=110) return 'printing';
  return 'otherprint';
}

const Services = {
  all: [],
  build(){
    this.all = RAW_SERVICES.map(r=>{
      const [num,en,bn,gov,min,max,unit] = r;
      const ov = Store.db.overrides[num] || {};
      const s = {
        num, en, bn, gov, unit,
        cat: catOf(num),
        shopMin: min, shopMax: max,
        shopStd: Math.round((min+max)/2),
        active: true,
        notes: ''
      };
      Object.assign(s, ov);
      s.govNum = firstNum(s.gov);
      s.govVar = isVariableFee(s.gov);
      return s;
    });
  },
  get(num){ return this.all.find(s=>s.num===Number(num)); },
  save(num, patch){
    Store.db.overrides[num] = Object.assign({}, Store.db.overrides[num]||{}, patch);
    Store.save();
    this.build();
  },
  list(){ return this.all; },
  active(){ return this.all.filter(s=>s.active); },
  isPrinting(s){ return CATEGORIES[s.cat] && CATEGORIES[s.cat].type==='print'; },
  search(q){
    q = String(q||'').trim().toLowerCase();
    if(!q) return this.all;
    return this.all.filter(s=>
      s.en.toLowerCase().includes(q) ||
      s.bn.includes(q) ||
      String(s.num)===q ||
      (CATEGORIES[s.cat].name.toLowerCase().includes(q)) ||
      (CATEGORIES[s.cat].bn.includes(q)) ||
      s.gov.toLowerCase().includes(q) ||
      s.unit.toLowerCase().includes(q)
    );
  }
};

   5. CHARTS (canvas, dependency-free)
   ========================================================================== */
const Chart = {
  _prep(cv){
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 300, h = cv.clientHeight || 180;
    cv.width = w*dpr; cv.height = h*dpr;
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,w,h);
    return {ctx,w,h};
  },
  css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); },
  bar(cv, data, opts){
    if(!cv) return;
    const {ctx,w,h} = this._prep(cv);
    const grid = this.css('--border'), txt = this.css('--text2');
    const padL=44, padR=10, padT=12, padB=26;
    const cw = w-padL-padR, ch = h-padT-padB;
    const max = Math.max(1, ...data.map(d=>d.value));
    ctx.strokeStyle = grid; ctx.lineWidth=1; ctx.font='10px sans-serif'; ctx.fillStyle=txt;
    for(let i=0;i<=4;i++){
      const y = padT + ch - (ch*i/4);
      ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
      ctx.fillText('₹'+Math.round(max*i/4), 3, y+3);
    }
    const bw = cw / Math.max(1,data.length);
    data.forEach((d,i)=>{
      const bh = (d.value/max)*ch;
      const x = padL + i*bw + bw*0.18;
      const y = padT + ch - bh;
      const g = ctx.createLinearGradient(0,y,0,padT+ch);
      g.addColorStop(0, opts && opts.color ? opts.color : '#D4AF37');
      g.addColorStop(1, '#1D5B40');
      ctx.fillStyle = g;
      const bwid = Math.max(3, bw*0.64);
      const r = Math.min(5, bwid/2);
      ctx.beginPath();
      ctx.moveTo(x, y+bh); ctx.lineTo(x, y+r);
      ctx.quadraticCurveTo(x, y, x+r, y);
      ctx.lineTo(x+bwid-r, y); ctx.quadraticCurveTo(x+bwid, y, x+bwid, y+r);
      ctx.lineTo(x+bwid, y+bh); ctx.closePath(); ctx.fill();
      ctx.fillStyle = txt; ctx.font='9.5px sans-serif'; ctx.textAlign='center';
      if(data.length<=14) ctx.fillText(d.label, x+bwid/2, h-8);
      ctx.textAlign='left';
    });
  },
  doughnut(cv, data){
    if(!cv) return;
    const {ctx,w,h} = this._prep(cv);
    const colors = ['#D4AF37','#1D5B40','#218653','#F2D98A','#778078','#C62828','#D98C16','#123D2B','#8fbfa3','#b8952c'];
    const total = data.reduce((a,b)=>a+b.value,0);
    const cx = w/2, cy = h/2, R = Math.min(w,h)/2 - 8, r = R*0.6;
    if(total<=0){
      ctx.strokeStyle = this.css('--border'); ctx.lineWidth = R-r;
      ctx.beginPath(); ctx.arc(cx,cy,(R+r)/2,0,Math.PI*2); ctx.stroke();
      return;
    }
    let ang = -Math.PI/2;
    data.forEach((d,i)=>{
      const a = (d.value/total)*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,R,ang,ang+a); ctx.closePath();
      ctx.fillStyle = colors[i%colors.length]; ctx.fill();
      ang += a;
    });
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle = this.css('--text'); ctx.font='bold 14px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(money(total), cx, cy);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
};

function openModal(title, body, opts){
  opts = opts || {};
  const root = $('#modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" data-act="closeModal">
      <div class="modal ${opts.wide?'wide':''}">
        <div class="modal-head">
          <h3>${esc(title)}</h3>
          <button class="icon-btn" data-act="closeModal" aria-label="Close">✕</button>
        </div>
        <div class="modal-body">${body}</div>
        ${opts.footer ? `<div class="modal-foot">${opts.footer}</div>` : ''}
      </div>
    </div>`;
  root.classList.add('open');
  const bd = $('.modal-backdrop', root);
  bd.addEventListener('click', e=>{ if(e.target===bd) closeModal(); });
}
function closeModal(){
  $('#modalRoot').classList.remove('open');
  $('#modalRoot').innerHTML = '';
}
function confirmDialog(msg, onYes, yesLabel){
  openModal('Please Confirm',
    `<div class="alert danger">${esc(msg)}</div>`,
    {footer:`<button class="btn ghost" data-act="closeModal">Cancel</button>
             <button class="btn danger" id="confYes">${esc(yesLabel||'Confirm')}</button>`});
  $('#confYes').onclick = ()=>{ closeModal(); onYes(); };
}

/**
 * Generic form modal.
 * fields: [{k,label,type,options,req,ph,value,rows,step,min,max,hint}]
 */
function formModal(title, fields, values, onSave, opts){
  values = values || {};
  opts = opts || {};
  const body = `<form id="gForm">${fields.map(f=>{
    const v = values[f.k] !== undefined ? values[f.k] : (f.value!==undefined?f.value:'');
    let input;
    if(f.type==='select'){
      input = `<select name="${f.k}" ${f.req?'required':''}>${
        (f.options||[]).map(o=>{
          const val = typeof o==='object'?o.v:o;
          const lab = typeof o==='object'?o.l:o;
          return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`;
        }).join('')}</select>`;
    } else if(f.type==='textarea'){
      input = `<textarea name="${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}" ${f.req?'required':''}>${esc(v)}</textarea>`;
    } else {
      input = `<input type="${f.type||'text'}" name="${f.k}" value="${esc(v)}"
        placeholder="${esc(f.ph||'')}" ${f.req?'required':''}
        ${f.step?`step="${f.step}"`:''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''}>`;
    }
    return `<div class="field"><label>${esc(f.label)}${f.req?' *':''}</label>${input}
      ${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
  }).join('')}</form>`;

  openModal(title, body, {
    wide: opts.wide,
    footer: `<button class="btn ghost" data-act="closeModal">Cancel</button>
             <button class="btn gold" id="gSave">${esc(opts.saveLabel||'Save')}</button>`
  });

  const submit = ()=>{
    const form = $('#gForm');
    if(!form.checkValidity()){ form.reportValidity(); return; }
    const fd = new FormData(form);
    const data = {};
    fields.forEach(f=>{
      let val = fd.get(f.k);
      if(val===null) val='';
      if(f.type==='number') val = val===''?'':Number(val);
      data[f.k] = val;
    });
    closeModal();
    onSave(data);
  };
  $('#gSave').onclick = submit;
  $('#gForm').addEventListener('submit', e=>{ e.preventDefault(); submit(); });
}

const Views = {};

/* -------------------- DASHBOARD -------------------- */
Views.dashboard = function(){
  const db = Store.db;
  const today = todayISO();
  const invToday = db.invoices.filter(i=> (i.date||'').slice(0,10)===today);
  const expToday = db.expenses.filter(e=> (e.date||'').slice(0,10)===today);

  const sum = (arr,f)=> arr.reduce((a,b)=>a+(Number(f(b))||0),0);

  const totalSales = sum(invToday, i=> i.total);
  const govTotal   = sum(invToday, i=> i.govTotal);
  const shopRev    = sum(invToday, i=> i.shopTotal + i.addlTotal - i.discount);
  const printRev   = sum(invToday.filter(i=> i.isPrinting), i=> i.shopTotal + i.addlTotal - i.discount);
  const servRev    = shopRev - printRev;
  const expenses   = sum(expToday, e=> e.amount);
  const netProfit  = shopRev - expenses;

  const pendingApps = db.applications.filter(a=> !['Completed','Delivered','Cancelled','Rejected'].includes(a.status)).length;
  const doneApps = db.applications.filter(a=> ['Completed','Delivered'].includes(a.status)).length;

  // last 7 days revenue
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    const v = db.invoices.filter(x=>(x.date||'').slice(0,10)===iso)
      .reduce((a,b)=>a+(b.shopTotal+b.addlTotal-b.discount),0);
    days.push({label: d.toLocaleDateString('en-IN',{weekday:'short'}), value: v});
  }

  // category distribution (all-time shop revenue)
  const catMap = {};
  db.invoices.forEach(i=>{
    (i.items||[]).forEach(it=>{
      const c = it.cat || 'printing';
      catMap[c] = (catMap[c]||0) + (it.shop*it.qty + it.addl*it.qty);
    });
  });
  const catData = Object.keys(catMap).map(k=>({label: (CATEGORIES[k]||{name:k}).name, value: catMap[k]}))
    .sort((a,b)=>b.value-a.value).slice(0,6);

  // payment method distribution
  const payMap = {};
  invToday.forEach(i=>{ payMap[i.payment] = (payMap[i.payment]||0) + i.total; });
  const payData = Object.keys(payMap).map(k=>({label:k, value:payMap[k]}));

  // most used services
  const svcMap = {};
  db.invoices.forEach(i=> (i.items||[]).forEach(it=>{

Views.dashboard.after = function(){
  const db = Store.db;
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const iso = d.toISOString().slice(0,10);
    const v = db.invoices.filter(x=>(x.date||'').slice(0,10)===iso)
      .reduce((a,b)=>a+(b.shopTotal+b.addlTotal-b.discount),0);
    days.push({label:d.toLocaleDateString('en-IN',{weekday:'short'}), value:v});
  }
  Chart.bar($('#c7'), days);

  const catMap = {};
  db.invoices.forEach(i=> (i.items||[]).forEach(it=>{
    const c = it.cat || 'printing';
    catMap[c] = (catMap[c]||0) + (it.shop*it.qty + it.addl*it.qty);
  }));
  const catData = Object.keys(catMap).map(k=>({label:k, value:catMap[k]})).sort((a,b)=>b.value-a.value).slice(0,6);
  Chart.doughnut($('#cCat'), catData);

  const today = todayISO();
  const payMap = {};
  db.invoices.filter(i=>(i.date||'').slice(0,10)===today)
    .forEach(i=>{ payMap[i.payment] = (payMap[i.payment]||0)+i.total; });
  Chart.doughnut($('#cPay'), Object.keys(payMap).map(k=>({label:k,value:payMap[k]})));
};

function catalogueHTML(filterKey){
  const q = state.catalogueQuery;
  let list = Services.search(q);
  if(filterKey && filterKey!=='all'){
    if(filterKey==='gov') list = list.filter(s=>['identity','ration','wb','health','edu','transport','business'].includes(s.cat));
    else if(filterKey==='fin') list = list.filter(s=>s.cat==='banking');
    else if(filterKey==='print') list = list.filter(s=>['printing','otherprint'].includes(s.cat));
    else if(filterKey==='free') list = list.filter(s=>/₹0/.test(s.gov));
    else if(filterKey==='paid') list = list.filter(s=> firstNum(s.gov)>0);
    else if(filterKey==='var') list = list.filter(s=> s.govVar);
    else list = list.filter(s=>s.cat===filterKey);
  }
  return list;
}

      state.catalogueQuery = e.target.value;

      const grid = $('.svc-grid') || $('.card .empty')?.closest('.card');

      const container = $('#view');
      const head = container.querySelector('.page-head');
      const html = renderCatalogue('All Services','Explore and manage every digital, government and printing service offered by your shop.', null);
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      const newGrid = tmp.querySelector('.svc-grid');
      const oldGrid = container.querySelector('.svc-grid');
      const oldEmpty = container.querySelector('.card .empty');
      if(newGrid && oldGrid){ oldGrid.replaceWith(newGrid); }
      else if(newGrid && oldEmpty){ oldEmpty.closest('.card').replaceWith(newGrid); }
      else if(!newGrid){
        const emptyCard = tmp.querySelector('.card:last-child');
        if(oldGrid) oldGrid.replaceWith(emptyCard);
      }
      // refresh count badge
      const badge = container.querySelector('.badge.blue');
      if(badge) badge.textContent = list.length + ' services';
      const si = $('#catSearch'); if(si){ si.focus(); si.setSelectionRange(si.value.length,si.value.length); }
    });
  }

Views.billing.after = function(){
  const custSel = $('#billCust');
  if(custSel) custSel.addEventListener('change', e=>{
    const id = e.target.value;
    state.billCustomer = id ? Store.db.customers.find(c=>c.id===id) : null;
  });

  const search = $('#billSvcSearch');
  const results = $('#billSvcResults');
  if(search && results){
    search.addEventListener('input', ()=>{
      const q = search.value.trim();
      if(!q){ results.style.display='none'; results.innerHTML=''; return; }
      const list = Services.search(q).slice(0,25);
      results.style.display = list.length?'block':'none';
      results.innerHTML = list.map(s=>`<div class="sr-item" data-act="billAddSvc" data-num="${s.num}">
        <div><div class="t">${esc(s.en)}</div><div class="s">${esc(s.bn)} · ${esc(s.unit)}</div></div>
        <span class="badge gold">${money(s.shopStd)}</span>
      </div>`).join('') || '';
    });
  }

  const disc = $('#billDiscount');
  if(disc) disc.addEventListener('input', e=>{ state.billDiscount = Number(e.target.value)||0; renderView(); });

  const paid = $('#billPaid');
  if(paid) paid.addEventListener('input', ()=>updateBillStatusHint());

  $$('[data-cart-qty]').forEach(inp=>inp.addEventListener('input', e=>{
    const i = Number(e.target.dataset.cartQty);
    state.cart[i].qty = Math.max(1, Number(e.target.value)||1);
    renderView();
  }));
  $$('[data-cart-gov]').forEach(inp=>inp.addEventListener('input', e=>{
    const i = Number(e.target.dataset.cartGov);
    state.cart[i].gov = Math.max(0, Number(e.target.value)||0);
    renderView();
  }));
  $$('[data-cart-shop]').forEach(inp=>inp.addEventListener('input', e=>{
    const i = Number(e.target.dataset.cartShop);
    state.cart[i].shop = Math.max(0, Number(e.target.value)||0);
    renderView();
  }));
  $$('[data-cart-addl]').forEach(inp=>inp.addEventListener('input', e=>{
    const i = Number(e.target.dataset.cartAddl);
    state.cart[i].addl = Math.max(0, Number(e.target.value)||0);
    renderView();
  }));
  updateBillStatusHint();
};
function updateBillStatusHint(){
  const hint = $('#billStatusHint');
  const paidEl = $('#billPaid');
  if(!hint || !paidEl) return;
  const cart = state.cart;
  const govTotal = cart.reduce((a,i)=>a+i.gov*i.qty,0);
  const shopTotal = cart.reduce((a,i)=>a+i.shop*i.qty,0);
  const addlTotal = cart.reduce((a,i)=>a+i.addl*i.qty,0);
  const total = govTotal+shopTotal+addlTotal-(Number(state.billDiscount)||0);
  const paid = Number(paidEl.value)||0;
  let s = 'Unpaid';
  if(paid >= total && total > 0) s = 'Paid';
  else if(paid > 0) s = 'Partial';
  hint.innerHTML = `Status: <b>${s}</b> · Balance: <b>${money(Math.max(0,total-paid))}</b>`;
}

Views.finance = function(){
  const db = Store.db;
  const inv = db.invoices;
  const expenses = db.expenses;
  const incomes = db.incomes;

  const shopRev = inv.reduce((a,i)=>a+i.shopTotal+i.addlTotal-i.discount,0);
  const govRev = inv.reduce((a,i)=>a+i.govTotal,0);
  const manualIncome = incomes.reduce((a,i)=>a+Number(i.amount||0),0);
  const totalExp = expenses.reduce((a,e)=>a+Number(e.amount||0),0);
  const net = shopRev + manualIncome - totalExp;

  const allTrans = [
    ...inv.map(i=>({type:'invoice', date:i.createdAt, label:'Invoice '+i.no, sub:(i.customerName||'Walk-in'), amount:i.total, method:i.payment, shop:i.shopTotal+i.addlTotal-i.discount, gov:i.govTotal})),
    ...incomes.map(i=>({type:'income', date:i.date, label:i.category, sub:i.description||'', amount:Number(i.amount), method:i.method, shop:Number(i.amount), gov:0})),
    ...expenses.map(e=>({type:'expense', date:e.date, label:e.category, sub:e.description||'', amount:-Number(e.amount), method:e.method, shop:0, gov:0}))

  return `

    <div class="stat red"><div class="lbl">Total Expenses</div><div class="val">${money(totalExp)}</div><div class="sub">${expenses.length} entries</div></div>
    <div class="stat ${net>=0?'green':'red'}"><div class="lbl">Net Business Income</div><div class="val">${money(net)}</div><div class="sub">Shop rev + income − expenses</div></div>
  </div>

  <div class="alert info mb">

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div class="card">
      <div class="section-title"><span class="bar"></span>Income Entries</div>

        <span class="k">${dt(i.date)} · ${esc(i.category)}<div class="tiny muted">${esc(i.description||'')}</div></span>
        <span class="v">${money(i.amount)}<div class="tiny muted">${esc(i.method||'')}</div></span>
      </div>`).join('') : '<div class="empty" style="padding:22px"><div class="e-ico">💵</div><p>No manual income entries.</p></div>'}
    </div>
    <div class="card">
      <div class="section-title"><span class="bar"></span>Expense Entries</div>

/* -------------------- REPORTS -------------------- */
Views.reports = function(){
  const from = state.reportFrom || (()=>{ const d=new Date(); d.setDate(1); return d.toISOString().slice(0,10); })();
  const to = state.reportTo || todayISO();

  const inRange = d => { const s=(d||'').slice(0,10); return s>=from && s<=to; };
  const inv = Store.db.invoices.filter(i=>inRange(i.date));
  const exp = Store.db.expenses.filter(e=>inRange(e.date));
  const inc = Store.db.incomes.filter(i=>inRange(i.date));

  const govTotal = inv.reduce((a,i)=>a+i.govTotal,0);
  const shopTotal = inv.reduce((a,i)=>a+i.shopTotal+i.addlTotal-i.discount,0);
  const printTotal = inv.filter(i=>i.isPrinting).reduce((a,i)=>a+i.shopTotal+i.addlTotal-i.discount,0);
  const otherIncome = inc.reduce((a,i)=>a+Number(i.amount||0),0);
  const expTotal = exp.reduce((a,e)=>a+Number(e.amount||0),0);
  const net = shopTotal + otherIncome - expTotal;
  const pending = inv.reduce((a,i)=>a+(i.total-i.paid),0);

  // service performance
  const svcMap = {};
  inv.forEach(i=>(i.items||[]).forEach(it=>{
    if(!svcMap[it.name]) svcMap[it.name] = {qty:0, rev:0};
    svcMap[it.name].qty += it.qty;
    svcMap[it.name].rev += (it.shop+it.addl)*it.qty;
  }));
  const perf = Object.entries(svcMap).sort((a,b)=>b[1].rev-a[1].rev).slice(0,10);

  // daily series
  const daily = {};
  inv.forEach(i=>{ const d=(i.date||'').slice(0,10); daily[d]=(daily[d]||0)+i.shopTotal+i.addlTotal-i.discount; });
  const dailyArr = Object.keys(daily).sort().map(d=>({label:d.slice(5), value:daily[d]}));

  return `
  <div class="page-head">
    <div>
      <div class="page-title">📈 Reports &amp; Analytics</div>
      <div class="page-sub">All figures are calculated from your actual stored records — never from sample data.</div>
    </div>
    <div class="page-actions">
      <button class="btn ghost" data-act="exportInvoices">⬇ Invoices CSV</button>
      <button class="btn ghost" data-act="printReport">🖨 Print Report</button>
    </div>
  </div>

  <div class="card mb">
    <div class="row3">
      <div class="field"><label>From Date</label><input type="date" id="repFrom" value="${from}"></div>
      <div class="field"><label>To Date</label><input type="date" id="repTo" value="${to}"></div>
      <div class="field"><label>&nbsp;</label><button class="btn block" data-act="applyReport">Apply Range</button></div>
    </div>
  </div>

  <div class="grid stat-grid mb">
    <div class="stat"><div class="lbl">Transactions</div><div class="val">${inv.length}</div><div class="sub">${dt(from)} → ${dt(to)}</div></div>
    <div class="stat"><div class="lbl">Total Collection</div><div class="val">${money(govTotal+shopTotal)}</div><div class="sub">Incl. govt fees</div></div>
    <div class="stat gold"><div class="lbl">Government Fees</div><div class="val">${money(govTotal)}</div><div class="sub">Pass-through</div></div>
    <div class="stat green"><div class="lbl">Shop Revenue</div><div class="val">${money(shopTotal)}</div><div class="sub">Printing: ${money(printTotal)}</div></div>
    <div class="stat red"><div class="lbl">Expenses</div><div class="val">${money(expTotal)}</div><div class="sub">${exp.length} entries</div></div>
    <div class="stat ${net>=0?'green':'red'}"><div class="lbl">Net Income</div><div class="val">${money(net)}</div><div class="sub">Shop rev + income − exp</div></div>
    <div class="stat"><div class="lbl">Pending Payments</div><div class="val">${money(pending)}</div><div class="sub">Unpaid balances</div></div>
    <div class="stat"><div class="lbl">Avg. Bill Value</div><div class="val">${money(inv.length? (govTotal+shopTotal)/inv.length : 0)}</div><div class="sub">Per invoice</div></div>
  </div>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div class="card">
      <div class="section-title"><span class="bar"></span>Daily Shop Revenue</div>
      <div class="chart-box"><canvas id="repChart"></canvas></div>
    </div>
    <div class="card">
      <div class="section-title"><span class="bar"></span>Service Performance (Top 10)</div>
      ${perf.length ? perf.map(([n,v])=>`<div class="kv">
        <span class="k tiny">${esc(n)}</span>
        <span class="v">${v.qty}× · ${money(v.rev)}</span></div>`).join('')
        : '<div class="empty" style="padding:22px"><p>No service data in this range.</p></div>'}
    </div>
  </div>

  <div class="card mt">
    <div class="section-title"><span class="bar"></span>Invoices in Range</div>
    ${inv.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Invoice</th><th>Date</th><th>Customer</th><th class="num">Govt Fee</th><th class="num">Shop</th><th class="num">Total</th><th class="num">Paid</th><th>Status</th></tr></thead>
      <tbody>${inv.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).map(i=>`<tr>
        <td><b>${esc(i.no)}</b></td>
        <td class="tiny">${dt(i.createdAt)}</td>
        <td>${esc(i.customerName||'Walk-in')}</td>
        <td class="num">${money(i.govTotal)}</td>
        <td class="num">${money(i.shopTotal+i.addlTotal-i.discount)}</td>
        <td class="num"><b>${money(i.total)}</b></td>
        <td class="num">${money(i.paid)}</td>
        <td><span class="badge ${i.status==='Paid'?'green':i.status==='Partial'?'gold':'red'}">${esc(i.status)}</span></td>
      </tr>`).join('')}</tbody></table></div>`
      : '<div class="empty" style="padding:26px"><div class="e-ico">📊</div><p>No invoices in this date range.</p></div>'}
  </div>`;
};

function addServiceToCart(num, overrides){
  const s = Services.get(num);
  if(!s){ toast('Service not found','err'); return; }
  const item = Object.assign({
    num: s.num,
    name: s.en,
    bn: s.bn,
    cat: s.cat,
    unit: s.unit,
    qty: 1,
    gov: s.govNum,
    shop: s.shopStd,
    addl: 0
  }, overrides||{});
  state.cart.push(item);
  toast('Added: ' + s.en, 'ok');
}

function saveBill(){
  if(!state.cart.length){ toast('Add at least one service','err'); return; }
  const db = Store.db;
  const cust = state.billCustomer;
  const govTotal = state.cart.reduce((a,i)=>a+i.gov*i.qty,0);
  const shopTotal = state.cart.reduce((a,i)=>a+i.shop*i.qty,0);
  const addlTotal = state.cart.reduce((a,i)=>a+i.addl*i.qty,0);
  const discount = Number(state.billDiscount)||0;
  const total = round2(govTotal + shopTotal + addlTotal - discount);

  const payEl = $('#billPay');
  const paidEl = $('#billPaid');
  const payment = payEl ? payEl.value : 'Cash';
  const paid = paidEl ? (Number(paidEl.value)||0) : total;

  let status = 'Unpaid';
  if(paid >= total - 0.001) status = 'Paid';
  else if(paid > 0) status = 'Partial';

  const prefix = db.settings.invoice.prefix || 'RDS';
  const no = prefix + '-' + String(db.settings.invoice.next).padStart(4,'0');
  db.settings.invoice.next = Number(db.settings.invoice.next) + 1;

  const isPrinting = state.cart.every(i=>['printing','otherprint'].includes(i.cat));

  const invoice = {
    id: nid(),
    no,
    createdAt: nowISO(),
    date: todayISO(),
    customerId: cust ? cust.id : null,
    customerName: cust ? cust.name : 'Walk-in Customer',
    customerMobile: cust ? cust.mobile : '',
    items: JSON.parse(JSON.stringify(state.cart)),
    govTotal: round2(govTotal),
    shopTotal: round2(shopTotal),
    addlTotal: round2(addlTotal),
    discount: round2(discount),
    total,
    paid: round2(paid),
    payment,
    status,
    isPrinting,
    notes: ''
  };

  db.invoices.push(invoice);
  Store.save();

  state.cart = [];
  state.billDiscount = 0;
  renderView();
  showInvoice(invoice.id);
  toast('Invoice ' + no + ' generated', 'ok');
}

/* ==========================================================================
   11. NOTIFICATIONS
   ========================================================================== */
function getNotifications(){
  const out = [];
  const db = Store.db;
  const today = todayISO();

  db.applications.forEach(a=>{
    if(['Completed','Delivered','Cancelled','Rejected'].includes(a.status)) return;
    if(a.followUpDate && a.followUpDate <= today){
      out.push({id:'app-'+a.id, icon:'📋', text:`Follow-up due: ${a.customerName} — ${a.serviceName}`, route:'applications'});
    }
  });

  db.invoices.forEach(i=>{
    const due = i.total - i.paid;
    if(due > 0.5){
      out.push({id:'inv-'+i.id, icon:'💵', text:`Unpaid balance ${money(due)} on ${i.no} (${i.customerName})`, route:'billing'});
    }
  });

  db.inventory.forEach(it=>{
    if(Number(it.qty) <= Number(it.minQty||0)){
      out.push({id:'inv-stock-'+it.id, icon:'📦', text:`Low stock: ${it.name} (${it.qty} ${it.unit||''})`, route:'inventory'});
    }
  });

  const todayInv = db.invoices.filter(i=>(i.date||'').slice(0,10)===today);
  if(todayInv.length){
    out.push({id:'closing-'+today, icon:'🌙', text:`Daily closing reminder — ${todayInv.length} bill(s) recorded today.`, route:'reports'});
  }
  if(db.invoices.length && db.invoices.length % 20 === 0){
    out.push({id:'backup-'+db.invoices.length, icon:'💾', text:'Backup reminder — export a JSON backup of your data.', route:'settings'});
  }

  return out.filter(n=> !db.dismissed.includes(n.id));
}
function updateNotifDot(){
  const n = getNotifications();
  const dot = $('#notifDot');
  if(dot) dot.style.display = n.length ? 'block' : 'none';
}
function openNotifications(){
  const list = getNotifications();
  openModal('Notifications',
    list.length ? `<div>${list.map(n=>`
      <div class="flex" style="padding:9px 0;border-bottom:1px dashed var(--border)">
        <span style="font-size:17px">${n.icon}</span>
        <span class="tiny" style="flex:1">${esc(n.text)}</span>
        <button class="btn sm ghost" data-act="notifDismiss" data-id="${n.id}">Dismiss</button>

    {footer:`<button class="btn ghost" data-act="closeModal">Close</button>`});

    .slice(0,6).forEach(a=> out.push({type:'Application', t:a.customerName+' — '+a.serviceName, s:a.status+' · '+a.id, act:'appView', id:a.id}));

  box.innerHTML = out.length ? out.map(o=>`

      <span class="badge blue">${o.type}</span>
    </div>`).join('')
    : '<div class="empty" style="padding:26px"><p class="tiny">No results found.</p></div>';
}

/* ==========================================================================

   ========================================================================== */
function download(filename, content, mime){
  const blob = new Blob([content], {type: mime||'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 400);
}
function toCSV(rows){
  return rows.map(r=> r.map(c=>{
    const s = String(c==null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
}
function exportInvoicesCSV(){
  const rows = [['Invoice','Date','Customer','Mobile','Govt Fee','Shop Charge','Additional','Discount','Total','Paid','Balance','Payment','Status']];
  Store.db.invoices.forEach(i=> rows.push([i.no, dtTime(i.createdAt), i.customerName, i.customerMobile||'', i.govTotal, i.shopTotal, i.addlTotal, i.discount, i.total, i.paid, round2(i.total-i.paid), i.payment, i.status]));
  if(rows.length===1){ toast('No invoices to export','err'); return; }
  download('invoices_'+todayISO()+'.csv', toCSV(rows), 'text/csv;charset=utf-8');
  toast('Invoices exported','ok');
}
function exportCustomersCSV(){
  const rows = [['ID','Name','Bengali Name','Mobile','Alt Mobile','Village','Post Office','Block','District','PIN','Registered']];
  Store.db.customers.forEach(c=> rows.push([c.id,c.name,c.bnName||'',c.mobile||'',c.altMobile||'',c.village||'',c.postOffice||'',c.block||'',c.district||'',c.pin||'',dt(c.createdAt)]));

  download('customers_'+todayISO()+'.csv', toCSV(rows), 'text/csv;charset=utf-8');
  toast('Customers exported','ok');

function exportServicesCSV(){
  const rows = [['#','English Name','Bengali Name','Category','Govt Fee','Shop Min','Shop Max','Default Shop Charge','Unit','Status']];
  Services.all.forEach(s=> rows.push([s.num, s.en, s.bn, CATEGORIES[s.cat].name, s.gov, s.shopMin, s.shopMax, s.shopStd, s.unit, s.active?'Active':'Inactive']));

function exportBackup(){
  download('rds_backup_'+todayISO()+'.json', JSON.stringify(Store.db, null, 2), 'application/json');
  toast('Backup exported','ok');
}
function importBackup(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try {
        const data = JSON.parse(reader.result);
        if(!data || typeof data !== 'object' || !data.settings) throw new Error('Invalid backup file');
        confirmDialog('This will REPLACE all current data in this browser with the backup contents. Continue?', ()=>{
          Store.db = data;
          const d = Store.defaults();
          Store.db.settings = Object.assign({}, d.settings, Store.db.settings||{});
          ['customers','applications','invoices','expenses','incomes','inventory','dismissed'].forEach(k=>{ if(!Array.isArray(Store.db[k])) Store.db[k]=[]; });
          if(!Store.db.overrides) Store.db.overrides = {};
          Store.save();
          Services.build();
          applyTheme(); 
          toast('Backup restored','ok');
          go('dashboard');
        }, 'Restore Backup');
      } catch(e){ toast('Invalid backup file','err'); }
    };
    reader.readAsText(f);
  };
  inp.click();
}

    if(existing){
      Object.assign(existing, rec);
      if(['Completed','Delivered'].includes(rec.status) && !existing.completedAt) existing.completedAt = nowISO();
    } else {
      Store.db.applications.push(Object.assign({
        id: 'A' + String(Store.db.counters.app).padStart(4,'0'),
        createdAt: nowISO()
      }, rec));
      Store.db.counters.app++;
    }
    Store.save();
    toast('Application saved','ok');
    renderView();
  }, {wide:true});
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  switch(act){

  /* --- navigation --- */
  case 'go':
    go(el.dataset.route);
    break;
  case 'toggleSidebar':
    $('#sidebar').classList.toggle('open');
    break;
  case 'toggleTheme': toggleTheme(); break;
  case 'toggleLang': toggleLang(); break;
  case 'closeModal': closeModal(); break;

  /* --- search --- */
  case 'openSearch': openSearch(); break;

  /* --- quick actions --- */
  case 'quickCustomer': customerForm(); break;
  case 'newBill': state.cart = state.cart||[]; go('billing'); break;
  case 'newApplication': applicationForm(); break;
  case 'addExpense': expenseForm(); break;
  case 'addIncome': incomeForm(); break;
  case 'addInventory': inventoryForm(); break;

  /* --- service catalogue --- */
  case 'catFilter':
    state.catalogueFilter = el.dataset.f;
    renderView();
    break;
  case 'svcDetail': serviceDetail(Number(el.dataset.num)); break;
  case 'svcAddBill':
    addServiceToCart(Number(el.dataset.num));
    go('billing');
    break;

  /* --- billing --- */
  case 'billAddSvc':
    addServiceToCart(Number(el.dataset.num));
    renderView();
    break;
  case 'cartRemove':
    state.cart.splice(Number(el.dataset.idx),1);
    renderView();
    break;
  case 'clearCart':
    confirmDialog('Clear the current bill draft?', ()=>{ state.cart=[]; state.billDiscount=0; renderView(); });
    break;
  case 'saveBill': saveBill(); break;
  case 'invoiceView': showInvoice(el.dataset.id); break;
  case 'invoicePrint': {
    const inv = Store.db.invoices.find(i=>i.id===el.dataset.id);
    if(inv) printDoc(invoiceHTML(inv));
    break;
  }
  case 'invoiceCopy': {
    const inv = Store.db.invoices.find(i=>i.id===el.dataset.id);
    if(inv){
      const txt = `INVOICE ${inv.no}\n${dtTime(inv.createdAt)}\nCustomer: ${inv.customerName}\n\n` +
        inv.items.map(i=>`${i.name} × ${i.qty} = ${money((i.gov+i.shop+i.addl)*i.qty)}`).join('\n') +
        `\n\nTotal: ${money(inv.total)}\nPaid: ${money(inv.paid)}\nStatus: ${inv.status}`;
      navigator.clipboard?.writeText(txt).then(()=>toast('Copied to clipboard','ok')).catch(()=>toast('Copy failed','err'));
    }
    break;
  }
  case 'invoicePayment': {
    const inv = Store.db.invoices.find(i=>i.id===el.dataset.id);
    if(!inv) break;
    const due = inv.total - inv.paid;
    formModal('Record Payment — ' + inv.no, [
      {k:'amount', label:'Amount Receiving ₹', type:'number', step:'0.5', value: round2(due), req:true},
      {k:'method', label:'Payment Method', type:'select', options:['Cash','UPI','Bank Transfer','Card','Other'], value: inv.payment}
    ], {}, data=>{
      inv.paid = round2(inv.paid + Number(data.amount));
      inv.payment = data.method;
      inv.status = inv.paid >= inv.total - 0.001 ? 'Paid' : (inv.paid>0?'Partial':'Unpaid');
      Store.save();
      toast('Payment recorded','ok');
      renderView();
      showInvoice(inv.id);
    });
    break;
  }

  /* --- customers --- */
  case 'custView': viewCustomer(el.dataset.id); break;
  case 'custEdit': {
    const c = Store.db.customers.find(x=>x.id===el.dataset.id);
    if(c) customerForm(c);
    break;
  }
  case 'custBill': {
    const c = Store.db.customers.find(x=>x.id===el.dataset.id);
    state.billCustomer = c || null;
    go('billing');
    break;
  }

  /* --- applications --- */
  case 'appFilter':
    state.params.status = el.dataset.f;
    renderView();
    break;
  case 'appView': viewApplication(el.dataset.id); break;
  case 'appEdit': {
    const a = Store.db.applications.find(x=>x.id===el.dataset.id);
    if(a) applicationForm(a);
    break;
  }
  case 'appPay': {
    const a = Store.db.applications.find(x=>x.id===el.dataset.id);
    if(!a) break;
    formModal('Add Payment — ' + a.id, [
      {k:'amount', label:'Amount ₹', type:'number', step:'0.5', value: round2(Math.max(0,(a.govFee+a.shopFee)-a.paid)), req:true}
    ], {}, d=>{
      a.paid = round2(a.paid + Number(d.amount));
      Store.save(); toast('Payment recorded','ok'); renderView(); viewApplication(a.id);
    });
    break;
  }
  case 'appReceipt': {
    const a = Store.db.applications.find(x=>x.id===el.dataset.id);
    if(a) printDoc(applicationReceiptHTML(a));
    break;
  }

  /* --- finance --- */
  case 'addExpense': expenseForm(); break;
  case 'addIncome': incomeForm(); break;

  /* --- inventory --- */
  case 'addInventory': inventoryForm(); break;
  case 'invEdit': {
    const it = Store.db.inventory.find(x=>x.id===el.dataset.id);
    if(it) inventoryForm(it);
    break;
  }
  case 'invAdjust': {
    const it = Store.db.inventory.find(x=>x.id===el.dataset.id);
    if(!it) break;
    const dir = Number(el.dataset.dir);
    formModal((dir>0?'Add Stock':'Reduce Stock') + ' — ' + it.name, [
      {k:'qty', label:'Quantity', type:'number', min:0.01, step:'0.01', value:1, req:true}
    ], {}, d=>{
      it.qty = round2(Number(it.qty) + dir*Number(d.qty));
      if(it.qty < 0) it.qty = 0;
      it.lastUpdate = nowISO();
      Store.save(); toast('Stock updated','ok'); renderView();
    });
    break;
  }

  /* --- reports --- */
  case 'applyReport': {
    state.reportFrom = $('#repFrom').value;
    state.reportTo = $('#repTo').value;
    renderView();
    break;
  }
  case 'printReport': {
    printDoc(`<div class="doc"><div class="doc-head"><div>
      <div class="doc-brand">${esc(Store.db.settings.business.name)}</div>
      <div class="doc-tag">Business Report · ${dt(todayISO())}</div></div></div>
      <p style="font-size:12px;margin-top:12px">Report generated from local records. Government fees are excluded from shop profit.</p>
      </div>`);
    break;
  }
  case 'exportInvoices': exportInvoicesCSV(); break;
  case 'exportCustomers': exportCustomersCSV(); break;
  case 'exportServices': exportServicesCSV(); break;

  /* --- price list --- */
  case 'applyPriceList': {
    state.params.mode = $('#plMode').value;
    state.params.lang = $('#plLang').value;
    $('#plPreview').innerHTML = priceListHTML(state.params.mode, state.params.lang);
    break;
  }
  case 'printPriceList': {
    printDoc(priceListHTML(state.params.mode||'all', state.params.lang||'both'));
    break;
  }
  case 'copyPriceList': {
    let list = Services.active();
    const txt = CFG.business + '\nCYBER CAFE • CSC • XEROX • PRINTING • STUDIO\n\n' +
      list.map(s=>`#${s.num} ${s.en} / ${s.bn}\n   Govt Fee: ${s.gov} | Shop: ${s.shopMin===s.shopMax?money(s.shopMin):money(s.shopMin)+'–'+money(s.shopMax)} (${s.unit})`).join('\n') +
      '\n\nসরকারি ফি সংশ্লিষ্ট সরকারি পোর্টাল অনুযায়ী প্রযোজ্য। দোকানের পরিষেবা ও প্রসেসিং চার্জ আলাদা।';
    navigator.clipboard?.writeText(txt).then(()=>toast('Price list copied','ok')).catch(()=>toast('Copy failed','err'));
    break;
  }

  /* --- settings --- */
  case 'saveBusiness': {
    const s = Store.db.settings.business;
    s.name = $('#stName').value || s.name;
    s.address = $('#stAddr').value;
    s.phone = $('#stPhone').value;
    s.email = $('#stEmail').value;
    s.footer = $('#stFooter').value;
    Store.save(); toast('Business profile saved','ok'); renderView();
    break;
  }
  case 'saveInvoiceSettings': {
    const s = Store.db.settings;
    s.invoice.prefix = $('#stPrefix').value || 'RDS';
    s.invoice.next = Math.max(1, Number($('#stNext').value)||1);
    s.defaults.shopCharge = Number($('#stShop').value)||30;
    s.defaults.payment = $('#stPay').value;
    Store.save(); toast('Invoice settings saved','ok'); renderView();
    break;
  }
  case 'saveDisplay': {
    Store.db.settings.theme = $('#stTheme').value;
    Store.db.settings.lang = $('#stLang').value;
    Store.save(); applyTheme(); renderView(); toast('Display settings saved','ok');
    break;
  }
  case 'exportBackup': exportBackup(); break;
  case 'importBackup': importBackup(); break;
  case 'resetApp':
    confirmDialog('This will permanently DELETE all customers, invoices, applications, expenses and inventory from this browser. Export a backup first if unsure. Continue?', ()=>{
      Store.reset(); Services.build(); applyTheme(); go('dashboard'); toast('Application reset','ok');
    }, 'Delete Everything');
    break;

  /* --- notifications --- */
  case 'openNotifications': openNotifications(); break;
  case 'notifDismiss': {
    Store.db.dismissed.push(el.dataset.id);
    Store.save();
    openNotifications();
    updateNotifDot();
    break;
  }

  /* --- printing calculators --- */
  case 'pcAdd': {
    const rate = Number($('#pcRate').value)||2;
    const pages = Number($('#pcPages').value)||1;
    const copies = Number($('#pcCopies').value)||1;
    addServiceToCart(100, {
      name: $('#pcType').selectedOptions[0].text.split('(')[0].trim(),
      qty: pages*copies,
      gov: 0, shop: rate, addl: 0, unit:'per page'
    });
    go('billing');
    break;
  }
  case 'phAdd': {
    const sel = $('#phSize');
    const rate = Number($('#phRate').value)||20;
    const qty = Number($('#phQty').value)||1;
    addServiceToCart(116, {name: sel.value, qty, gov:0, shop: rate, addl:0, unit:'per print'});
    go('billing');
    break;
  }
  case 'lmAdd': {
    const sel = $('#lmSize');
    const rate = Number($('#lmRate').value)||25;
    const qty = Number($('#lmQty').value)||1;
    const cut = Number($('#lmCut').value)||0;
    addServiceToCart(111, {name: sel.value, qty, gov:0, shop: rate, addl: cut, unit:'per unit'});
    go('billing');
    break;
  }
  case 'bdAdd': {
    const sel = $('#bdType');
    const rate = Number($('#bdRate').value)||40;
    const qty = Number($('#bdQty').value)||1;
    addServiceToCart(107, {name: sel.value, qty, gov:0, shop: rate, addl:0, unit:'per copy'});
    go('billing');
    break;
  }
  case 'mxAdd': {
    const desc = $('#mxDesc').value.trim() || 'Printing item';
    const qty = Number($('#mxQty').value)||1;
    const rate = Number($('#mxRate').value)||0;
    state.mixed = state.mixed || [];
    state.mixed.push({desc, qty, rate});
    renderMixedList();
    break;
  }
  case 'mxToBill': {
    if(!state.mixed || !state.mixed.length){ toast('Add at least one item','err'); break; }
    state.mixed.forEach(m=>{
      state.cart.push({
        num: 0, name: m.desc, bn:'', cat:'printing', unit:'item',
        qty: m.qty, gov:0, shop: m.rate, addl:0
      });
    });
    state.mixed = [];
    toast('Added to bill','ok');
    go('billing');
    break;
  }
  }
});

function renderMixedList(){
  const box = $('#mxList');
  if(!box) return;
  const items = state.mixed || [];
  const total = items.reduce((a,i)=>a+i.qty*i.rate,0);
  $('#mxCount').textContent = items.length + ' items · ' + money(total);
  box.innerHTML = items.length ? items.map((m,i)=>`
    <div class="kv"><span class="k">${esc(m.desc)} × ${m.qty}</span>
    <span class="v">${money(m.qty*m.rate)} <button class="btn sm ghost" onclick="void 0" data-act="mxDel" data-i="${i}">✕</button></span></div>`).join('')
    : 'No items added yet.';
  $$('[data-act="mxDel"]').forEach(b=> b.onclick = ()=>{
    state.mixed.splice(Number(b.dataset.i),1); renderMixedList();
  });
}

  openModal('Service #' + s.num, `
    <div class="cat" style="font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#9a7c1e">${cat.icon} ${esc(cat.name)}</div>
    <h2 style="font-size:17px;font-weight:800;margin:6px 0 2px">${esc(s.en)}</h2>
    <div class="muted" style="margin-bottom:12px">${esc(s.bn)}</div>

    <div class="kv"><span class="k">Official Government Fee</span><span class="v">${esc(s.gov)}</span></div>
    <div class="kv"><span class="k">Shop Service Charge</span><span class="v">${s.shopMin===s.shopMax?money(s.shopMin):money(s.shopMin)+' – '+money(s.shopMax)}</span></div>
    <div class="kv"><span class="k">Default Shop Charge</span><span class="v">${money(s.shopStd)}</span></div>
    <div class="kv"><span class="k">Pricing Unit</span><span class="v">${esc(s.unit)}</span></div>
    <div class="kv"><span class="k">Estimated Total</span><span class="v" style="color:var(--success);font-size:15px">${money(est)}</span></div>
    <div class="kv"><span class="k">Availability</span><span class="v">${s.active?'<span class="badge green">Available</span>':'<span class="badge grey">Not offered</span>'}</span></div>
    ${s.notes?`<div class="divider"></div><div class="tiny muted">${esc(s.notes)}</div>`:''}

    <div class="alert info mt tiny">
      <b>Pricing transparency:</b> Government fee is collected for the official portal and is not shop profit.
      Shop charges are indicative business prices — not official CSC-approved tariffs.
      ${s.govVar?'<br><b>This government fee is variable.</b> Confirm the actual amount on the official portal at billing time.':''}
    </div>
  `, {
    footer:`
      <button class="btn ghost" data-act="closeModal">Close</button>
      <button class="btn ghost" data-act="svcEdit" data-num="${s.num}">✎ Edit Price</button>
      <button class="btn gold" data-act="svcAddBill" data-num="${s.num}">＋ Add to Bill</button>
    `
  });

  const btn = $('[data-act="svcEdit"]');

function serviceEdit(num){
  const s = Services.get(num);
  if(!s) return;
  formModal('Edit Price — #' + s.num, [
    {k:'gov', label:'Government Fee (display text)', value:s.gov, hint:'You can keep ₹0 – ₹50, "Portal Fee Actual", "Ticket Fare" etc.'},
    {k:'shopMin', label:'Minimum Shop Charge ₹', type:'number', step:'0.5', value:s.shopMin},
    {k:'shopMax', label:'Maximum Shop Charge ₹', type:'number', step:'0.5', value:s.shopMax},
    {k:'shopStd', label:'Default Shop Charge ₹', type:'number', step:'0.5', value:s.shopStd},
    {k:'unit', label:'Pricing Unit', value:s.unit},
    {k:'active', label:'Availability', type:'select', options:[{v:'true',l:'Available'},{v:'false',l:'Not offered'}], value:String(s.active)},
    {k:'notes', label:'Notes', type:'textarea', rows:2, value:s.notes||''}
  ], {}, d=>{
    Services.save(num, {
      gov: d.gov,
      shopMin: Number(d.shopMin)||0,
      shopMax: Number(d.shopMax)||0,
      shopStd: Number(d.shopStd)||0,
      unit: d.unit,
      active: d.active==='true',
      notes: d.notes
    });
    toast('Price updated — old invoices unchanged','ok');
    renderView();
  }, {wide:true});
}

const EXPENSE_CATS = ['Paper Purchase','Ink / Toner','Photo Paper','Lamination Pouches','PVC Cards','Spiral Binding Materials','Electricity','Internet','Equipment Maintenance','Shop Rent','Transportation','Packaging','Other Expenses'];
const INCOME_CATS = ['Government Application Facilitation','Printing','Photocopy','Colour Printing','Photo Printing','Lamination','PVC Card Printing','Binding','Document Processing','Ticket Booking Commission','Money Transfer Commission','Other Services'];

function expenseForm(){
  formModal('Add Expense', [
    {k:'date', label:'Date', type:'date', value: todayISO(), req:true},
    {k:'category', label:'Category', type:'select', options:EXPENSE_CATS, req:true},
    {k:'description', label:'Description', ph:'e.g. 2 reams A4 70 GSM'},
    {k:'amount', label:'Amount ₹', type:'number', step:'0.5', req:true},
    {k:'method', label:'Payment Method', type:'select', options:['Cash','UPI','Bank Transfer','Card','Other']},
    {k:'supplier', label:'Supplier (optional)'},
    {k:'notes', label:'Notes', type:'textarea', rows:2}
  ], {}, d=>{
    Store.db.expenses.push(Object.assign({id:nid(), createdAt:nowISO()}, d, {amount:Number(d.amount)||0}));
    Store.save(); toast('Expense recorded','ok'); renderView();
  });
}
function incomeForm(){
  formModal('Add Income', [
    {k:'date', label:'Date', type:'date', value: todayISO(), req:true},
    {k:'category', label:'Category', type:'select', options:INCOME_CATS, req:true},
    {k:'description', label:'Description'},
    {k:'amount', label:'Amount ₹', type:'number', step:'0.5', req:true},
    {k:'method', label:'Payment Method', type:'select', options:['Cash','UPI','Bank Transfer','Card','Other']},
    {k:'notes', label:'Notes', type:'textarea', rows:2}
  ], {}, d=>{
    Store.db.incomes.push(Object.assign({id:nid(), createdAt:nowISO()}, d, {amount:Number(d.amount)||0}));
    Store.save(); toast('Income recorded','ok'); renderView();
  });
}
function inventoryForm(existing){
  const it = existing || {};
  formModal(existing?'Edit Inventory Item':'Add Inventory Item', [
    {k:'name', label:'Item Name', req:true, value: it.name||''},
    {k:'category', label:'Category', type:'select', options:['Paper','Printing Materials','Other Materials'], value: it.category||'Paper'},
    {k:'qty', label:'Quantity', type:'number', step:'0.01', value: it.qty!==undefined?it.qty:0},
    {k:'unit', label:'Unit', type:'select', options:['pcs','sheets','reams','packs','bottles','rolls','boxes'], value: it.unit||'pcs'},
    {k:'purchasePrice', label:'Purchase Price ₹ / unit', type:'number', step:'0.5', value: it.purchasePrice!==undefined?it.purchasePrice:0},
    {k:'minQty', label:'Minimum Stock Level', type:'number', step:'0.01', value: it.minQty!==undefined?it.minQty:0},
    {k:'supplier', label:'Supplier', value: it.supplier||''}
  ], it, d=>{
    if(existing){
      Object.assign(existing, d, {qty:Number(d.qty)||0, purchasePrice:Number(d.purchasePrice)||0, minQty:Number(d.minQty)||0});
    } else {
      Store.db.inventory.push(Object.assign({id:nid(), createdAt:nowISO()}, d,
        {qty:Number(d.qty)||0, purchasePrice:Number(d.purchasePrice)||0, minQty:Number(d.minQty)||0}));
    }
    Store.save(); toast('Inventory saved','ok'); renderView();
  });
}

/* ==========================================================================
   19. INIT
   ========================================================================== */
function init(){
  Store.load();
  Services.build();
  applyTheme();
  renderNav();
  renderView();

  // seed some starter inventory categories if empty (only structure, no fake quantities)
  if(Store.db.inventory.length===0 && !localStorage.getItem(CFG.storageKey+'_seeded')){
    localStorage.setItem(CFG.storageKey+'_seeded','1');
  }

  // close sidebar on outside click (mobile)
  document.addEventListener('click', e=>{
    const sb = $('#sidebar');
    if(sb.classList.contains('open') && !sb.contains(e.target) && !e.target.closest('[data-act="toggleSidebar"]')){
      sb.classList.remove('open');
    }
  });

  // global search overlay handlers
  const gs = $('#gsInput');
  if(gs){
    gs.addEventListener('input', ()=> runGlobalSearch(gs.value));
    gs.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSearch(); });
  }

  console.log('%c RIYAJUL DIGITAL SOLUTIONS ', 'background:#123D2B;color:#D4AF37;font-weight:bold;padding:4px 8px;border-radius:4px',
    'Cyber Cafe & CSC Service Manager ready. ' + Services.all.length + ' services loaded.');
}

window.addEventListener('DOMContentLoaded', init);
if(document.readyState!=='loading') init();

})();
</script>
